<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabs</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>https://roadmap.sh/projects/simple-tabs</h1>
    <div id="veryBigBox">
    <div class="container">
    <button id="firstTab" class="tabs" style="color: black; border-style: hidden hidden solid">
    First Tab
    </button>
    <button id="secondTab" class="tabs" style="color: grey; border-style: hidden hidden hidden">
    Second Tab
    </button>
    <button id="thirdTab" class="tabs" style="color: grey; border-style: hidden hidden hidden">
    Third Tab
    </button>
    <button id="forthTab" class="tabs" style="color: grey; border-style: hidden hidden hidden">
    Forth Tab
    </button>
    </div>
    <div id="content-display-container">
        <p>Clicking each tab should hide the content of the other tab and show the content of clicked tab. By default, enable the first tab.
        </p>
        <div id="content-display">
            First Tab content to be displayed here.
        </div>
        <p>
        Add some dummy content or just add a simple text showing the tab
        </p>
    </div>
    <div>

    <script src="script.js"></script>
</body>
</html>
